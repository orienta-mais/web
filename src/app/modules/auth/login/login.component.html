<div class="flex flex-col items-center justify-center min-h-screen bg-gray-100">
  <div class="w-full max-w-md p-8 bg-white rounded-2xl shadow-lg">
    <div class="flex items-center gap-3 mb-6 w-full justify-center">
      <h1 class="text-2xl font-bold text-gray-500">Orienta Mais</h1>
      <img
        src="logoMentored.png"
        alt="Logo Orienta Mais"
        class="h-12 w-auto object-contain cursor-pointer"
      />
    </div>
    <form [formGroup]="loginForm" (ngSubmit)="handleLogin()">
      <p-floatlabel>
        <input pInputText id="email" formControlName="email" autocomplete="off" class="w-full" />
        <label for="email">Email</label>
      </p-floatlabel>

      <div *ngIf="email?.touched && email?.errors?.['required']" class="text-red-500 text-sm mt-1">
        Email é obrigatório
      </div>
      <div
        *ngIf="email?.touched && email?.errors?.['invalidEmail']"
        class="text-red-500 text-sm mt-1"
      >
        Email não é válido
      </div>

      <p-floatlabel class="mt-6 relative">
        <input
          pInputText
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          autocomplete="off"
          class="w-full pr-12"
        />
        <label for="password">Senha</label>
        <button
          type="button"
          class="absolute right-3 top-1/2 -translate-y-1/2 text-yellow-600 hover:text-yellow-800"
          (click)="togglePasswordVisibility()"
        >
          <i [class]="showPassword ? 'pi pi-eye' : 'pi pi-eye-slash'"></i>
        </button>
      </p-floatlabel>

      <div
        *ngIf="password?.touched && password?.errors?.['required']"
        class="text-red-500 text-sm mt-1"
      >
        Senha é obrigatória
      </div>

      <p-button type="submit" label="Entrar" severity="primary" styleClass="w-full mt-4"></p-button>
    </form>

    <div class="mt-3 text-center gap-2">
      <p-button label="Cadastrar" (click)="register()" severity="secondary" styleClass="w-full">
      </p-button>

      <button class="text-blue-600 hover:underline cursor-pointer mt-2" (click)="forgotPassword()">
        Esqueceu a senha?
      </button>
    </div>

    <!-- 🔽 Links de política e termos -->
    <div
      class="mt-6 text-center text-sm text-gray-500 flex flex-col sm:flex-row gap-2 justify-center"
    >
      <button class="hover:text-blue-600 underline" type="button" (click)="openPrivacy()">
        Política de Privacidade
      </button>
      <span class="hidden sm:inline">•</span>
      <button class="hover:text-blue-600 underline" type="button" (click)="openTerms()">
        Termos de Uso
      </button>
    </div>
  </div>
</div>
