<div class="flex items-center justify-center min-h-screen bg-gray-100">
  <ng-container *ngIf="screenValidated; else screenError">
    <div class="w-full max-w-md p-8 bg-white rounded-2xl shadow-lg">
      <h2 class="text-3xl font-bold mb-8 text-center text-gray-800">Digite sua nova senha!</h2>

      <form [formGroup]="form" (ngSubmit)="handleUpdatePassword()">
        <div class="space-y-4">
          <!-- Nova senha -->
          <div class="relative w-full">
            <p-floatlabel class="w-full">
              <input
                pInputText
                [type]="showPassword ? 'text' : 'password'"
                formControlName="newPassword"
                autocomplete="off"
                class="w-full pr-12"
              />
              <label>Nova senha</label>
              <button
                type="button"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-yellow-600 hover:text-yellow-800"
                (click)="togglePasswordVisibility()"
              >
                <i [class]="showPassword ? 'pi pi-eye' : 'pi pi-eye-slash'"></i>
              </button>
            </p-floatlabel>

            <div
              *ngIf="newPassword?.touched && newPassword?.errors?.['required']"
              class="text-red-500 text-sm mt-1"
            >
              Campo obrigatório
            </div>
            <div
              *ngIf="newPassword?.touched && newPassword?.errors?.['minlength']"
              class="text-red-500 text-sm mt-1"
            >
              Senha deve ter no mínimo 8 caracteres
            </div>
            <div
              *ngIf="newPassword?.touched && newPassword?.errors?.['pattern']"
              class="text-red-500 text-sm mt-1"
            >
              A senha deve conter letra maiúscula, minúscula, número e caractere especial
            </div>
          </div>

          <!-- Confirmar senha -->
          <div class="relative w-full">
            <p-floatlabel class="w-full">
              <input
                pInputText
                [type]="showConfirmPassword ? 'text' : 'password'"
                formControlName="confirmPassword"
                autocomplete="off"
                class="w-full pr-12"
              />
              <label>Confirmar nova senha</label>
              <button
                type="button"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-yellow-600 hover:text-yellow-800"
                (click)="toggleConfirmPasswordVisibility()"
              >
                <i [class]="showConfirmPassword ? 'pi pi-eye' : 'pi pi-eye-slash'"></i>
              </button>
            </p-floatlabel>

            <div
              *ngIf="confirmPassword?.touched && confirmPassword?.errors?.['required']"
              class="text-red-500 text-sm mt-1"
            >
              Campo obrigatório
            </div>
            <div
              *ngIf="
                confirmPassword?.touched &&
                confirmPassword?.value !== newPassword?.value &&
                confirmPassword?.value
              "
              class="text-red-500 text-sm mt-1"
            >
              As senhas não coincidem
            </div>
          </div>
        </div>

        <p-button
          type="submit"
          label="Confirmar"
          severity="primary"
          styleClass="w-full mt-4"
        ></p-button>
      </form>
    </div>
  </ng-container>

  <ng-template #screenError>
    <div class="p-6 text-center">
      <h1 class="text-2xl font-semibold text-red-600">Página não encontrada</h1>
      <p class="mt-2 text-gray-600">O link que você acessou é inválido ou expirou.</p>
    </div>
  </ng-template>
</div>
