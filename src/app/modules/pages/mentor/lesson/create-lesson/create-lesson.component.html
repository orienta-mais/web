<div class="flex justify-center items-center min-h-[calc(100vh-4rem)] bg-gray-50">
  <div class="w-full max-w-2xl p-8 rounded-2xl shadow-lg bg-white">
    <div>
      <p-button
        label="Voltar"
        icon="pi pi-arrow-left"
        styleClass="p-button-text text-gray-700 hover:text-blue-600"
        (click)="goBack()"
      ></p-button>

      <h2 class="text-3xl font-bold text-gray-800 text-center mb-6">Cadastrar Aula</h2>
    </div>

    <form [formGroup]="form" (ngSubmit)="handleSubmit()" class="space-y-5">
      <!-- Título -->
      <p-floatlabel>
        <input pInputText id="title" formControlName="title" maxlength="200" class="w-full" />
        <label for="title">Título</label>
      </p-floatlabel>

      <!-- Descrição -->
      <p-floatlabel>
        <textarea
          pInputTextarea
          id="description"
          formControlName="description"
          rows="4"
          class="w-full"
        ></textarea>
        <label for="description">Descrição</label>
      </p-floatlabel>

      <!-- Código -->
      <p-floatlabel>
        <input
          pInputText
          id="presentCode"
          formControlName="presentCode"
          maxlength="5"
          class="w-full"
        />
        <label for="presentCode">Código de presença</label>
      </p-floatlabel>

      <!-- MAX GUEST -->
      <p-floatlabel>
        <input
          pInputText
          id="maxGuest"
          formControlName="maxGuest"
          type="number"
          min="1"
          class="w-full"
        />
        <label for="maxGuest">Máximo de convidados</label>
      </p-floatlabel>

      <!-- Data -->
      <div>
        <label class="block text-gray-700 font-medium mb-2">Data da aula</label>
        <p-datepicker
          formControlName="date"
          [showIcon]="true"
          dateFormat="dd/mm/yy"
          [minDate]="today"
          [showButtonBar]="true"
          styleClass="w-full"
        ></p-datepicker>
      </div>

      <!-- Horários -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-gray-700 font-medium mb-2">Hora de início</label>
          <input
            type="time"
            formControlName="startTime"
            class="w-full border rounded-md px-3 py-2"
          />
        </div>

        <div>
          <label class="block text-gray-700 font-medium mb-2">Hora de fim</label>
          <input type="time" formControlName="endTime" class="w-full border rounded-md px-3 py-2" />
        </div>
      </div>

      <!-- LINKS -->
      <div>
        <label class="block text-gray-700 font-semibold mb-2">Links adicionais</label>

        <div formArrayName="additionalLinks" class="space-y-3">
          <div
            *ngFor="let link of additionalLinks.controls; let i = index"
            class="flex gap-3 items-center"
          >
            <input
              type="text"
              class="border p-2 rounded w-full"
              [formControlName]="i"
              placeholder="Insira o link aqui"
              #linkInput
              (blur)="onLinkBlur(i)"
            />

            <button
              type="button"
              pButton
              icon="pi pi-trash"
              severity="danger"
              (click)="removeLink(i)"
            ></button>
          </div>
        </div>

        <button
          type="button"
          class="mt-3 text-blue-600 font-medium hover:underline"
          (click)="addLink()"
        >
          + Adicionar link
        </button>
      </div>

      <!-- Salvar -->
      <p-button
        type="submit"
        label="Salvar Aula"
        severity="primary"
        styleClass="w-full mt-6"
        [loading]="loading"
        [disabled]="form.invalid"
      ></p-button>
    </form>
  </div>
</div>
