<div class="flex justify-center items-center min-h-[calc(100vh-4rem)]">
  <div class="bg-white rounded-2xl shadow-lg p-8 max-w-lg w-full">
    <h2 class="text-3xl font-bold text-gray-800 mb-4 text-center">
      {{ editMode ? 'Editar Aula' : 'Detalhes da Aula' }}
    </h2>

    <!-- FORMULÁRIO DE EDIÇÃO -->
    <form *ngIf="editMode" [formGroup]="form" (ngSubmit)="handleUpdate()" class="space-y-4">
      <p-floatlabel>
        <input pInputText formControlName="title" class="w-full" />
        <label for="title">Título</label>
      </p-floatlabel>

      <p-floatlabel>
        <textarea pInputTextarea formControlName="description" rows="3" class="w-full"></textarea>
        <label for="description">Descrição</label>
      </p-floatlabel>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-gray-700 font-medium mb-2">Data</label>
          <p-datepicker
            formControlName="date"
            [showIcon]="true"
            dateFormat="dd/mm/yy"
            styleClass="w-full"
          ></p-datepicker>
        </div>
        <div>
          <label class="block text-gray-700 font-medium mb-2">Hora de início</label>
          <input
            type="time"
            formControlName="initialTime"
            class="w-full border rounded-md px-3 py-2"
          />
        </div>
        <div>
          <label class="block text-gray-700 font-medium mb-2">Hora de fim</label>
          <input
            type="time"
            formControlName="finalTime"
            class="w-full border rounded-md px-3 py-2"
          />
        </div>
      </div>

      <p-button
        type="submit"
        label="Salvar Alterações"
        severity="success"
        styleClass="w-full mt-4"
        [loading]="loading"
      ></p-button>

      <p-button
        type="button"
        label="Cancelar"
        severity="secondary"
        styleClass="w-full mt-2"
        (click)="cancelEdit()"
      ></p-button>
    </form>

    <div *ngIf="!editMode" class="space-y-6">
      <div class="bg-gray-50 rounded-xl p-5 border border-gray-200 shadow-sm">
        <h3 class="text-lg font-semibold text-gray-800 mb-4 border-b pb-2">Informações da Aula</h3>

        <div class="space-y-3">
          <div>
            <p class="text-sm text-gray-500 font-medium">Título</p>
            <p class="text-base text-gray-800 font-semibold">{{ leason?.title }}</p>
          </div>

          <div>
            <p class="text-sm text-gray-500 font-medium">Descrição</p>
            <p class="text-base text-gray-700 whitespace-pre-line">{{ leason?.description }}</p>
          </div>

          <div class="grid grid-cols-2 gap-6 mt-4">
            <div>
              <p class="text-sm text-gray-500 font-medium">Data</p>
              <p class="text-base text-gray-800">{{ leason?.date | date: 'dd/MM/yyyy' }}</p>
            </div>

            <div>
              <p class="text-sm text-gray-500 font-medium">Hora de início</p>
              <p class="text-base text-gray-800">{{ leason?.initialTime }}</p>
            </div>

            <div>
              <p class="text-sm text-gray-500 font-medium">Hora de fim</p>
              <p class="text-base text-gray-800">{{ leason?.finalTime }}</p>
            </div>
          </div>
        </div>
      </div>

      <div class="flex gap-4 mt-8 justify-center">
        <p-button
          label="Editar Aula"
          icon="pi pi-pencil"
          styleClass="w-50"
          severity="info"
          (click)="enableEdit()"
        ></p-button>

        <p-button
          label="Excluir Aula"
          icon="pi pi-trash"
          severity="danger"
          styleClass="w-50"
          (click)="confirmDelete()"
        ></p-button>
      </div>
    </div>
  </div>
</div>

<p-confirmDialog></p-confirmDialog>
