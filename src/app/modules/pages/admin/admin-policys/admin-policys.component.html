<div class="p-6 space-y-8 bg-sky-50">
  <!-- HEADER -->
  <div>
    <h1 class="text-3xl font-bold text-gray-800">Gerenciar Política / Termos</h1>
    <p class="text-gray-500">
      Escolha o tipo de documento e cole o conteúdo em HTML para exibição no site.
    </p>
  </div>

  <!-- FORM WRAPPER -->
  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    class="space-y-6 w-full max-w-3xl bg-white p-6 rounded-lg shadow"
  >
    <!-- SELECT TYPE -->
    <div class="flex flex-col gap-1">
      <label class="font-medium text-gray-700">Tipo de Documento</label>

      <select
        formControlName="type"
        class="w-full border rounded-lg px-3 py-2 bg-white focus:ring focus:ring-blue-300"
      >
        <option [value]="policyTypes.PRIVACY">Política de Privacidade</option>
        <option [value]="policyTypes.TERMS">Termos de Uso</option>
      </select>
    </div>

    <!-- HTML CONTENT -->
    <div class="flex flex-col gap-1">
      <label class="font-medium text-gray-700">Conteúdo (HTML)</label>

      <textarea
        formControlName="content"
        rows="18"
        class="w-full border rounded-lg p-3 font-mono text-sm bg-white focus:ring focus:ring-blue-300"
        placeholder="Cole aqui o HTML que será exibido no site..."
      ></textarea>
    </div>

    <!-- BUTTON -->
    <button
      type="submit"
      class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition disabled:bg-gray-400"
      [disabled]="form.invalid"
    >
      Salvar
    </button>
  </form>
</div>
