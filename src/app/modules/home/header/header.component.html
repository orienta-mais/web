<header
  [ngClass]="{
    'bg-blue-700': role === 'MENTOR',
    'bg-yellow-500': role === 'MENTORED',
  }"
  class="text-white shadow-md"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <!-- Logo -->
      <div class="flex items-center space-x-2">
        <div class="text-2xl font-bold">🚀 OrientaMais</div>
      </div>

      <!-- Menu -->
      <div class="flex space-x-6 items-center">
        <ng-container *ngIf="role === 'MENTOR'">
          <a
            routerLink="/lesson"
            routerLinkActive="text-yellow-400"
            class="hover:text-yellow-300 transition"
          >
            Reunião
          </a>
          <a
            routerLink="/mentor/profile"
            routerLinkActive="text-yellow-400"
            class="hover:text-yellow-300 transition"
          >
            Perfil
          </a>
        </ng-container>

        <ng-container *ngIf="role === 'MENTORED'">
          <a
            routerLink="/mentored/lesson"
            routerLinkActive="text-yellow-400"
            class="hover:text-yellow-300 transition"
          >
            Reunião
          </a>
          <a
            routerLink="/home/pagina4"
            routerLinkActive="text-yellow-400"
            class="hover:text-yellow-300 transition"
          >
            Página 4
          </a>
        </ng-container>
      </div>

      <!-- Usuário / Logout -->
      <div class="flex items-center space-x-4">
        <span class="text-sm font-medium">Olá, {{ name }}</span>
        <button
          class="px-3 py-1 bg-red-600 hover:bg-red-700 rounded-md text-white text-sm"
          (click)="logout()"
        >
          Sair
        </button>
      </div>
    </div>
  </div>
</header>
